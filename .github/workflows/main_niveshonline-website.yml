name: Build and deploy PHP app to Azure Web App - niveshonline-website

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Setup PHP 8.2 with MongoDB preinstalled
      - name: Setup PHP (8.2 with mongodb)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mongodb
          tools: composer

      # Copy mongodb.so into bin (so Azure can load it at runtime)
      - name: Copy mongodb.so into bin
        run: |
          EXT_DIR="$(php -r 'echo ini_get("extension_dir");')"
          echo "extension_dir is: $EXT_DIR"
          SRC="$EXT_DIR/mongodb.so"

          if [ ! -f "$SRC" ]; then
            echo "mongodb.so not found at $SRC, searching..."
            SRC="$(find /usr/lib /usr/local/lib /opt -type f -name mongodb.so 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "ERROR: Could not locate mongodb.so on the runner"
            php -m | sort
            php -i | grep -i extension_dir -n || true
            exit 1
          fi

          echo "Found mongodb.so at: $SRC"
          mkdir -p bin
          cp "$SRC" bin/mongodb.so
          ls -l bin

      # Install Composer dependencies (skip platform req check)
      - name: Install Composer dependencies
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --ignore-platform-req=ext-mongodb

      # Clear and rebuild Laravel caches (automatic)
      - name: Rebuild Laravel caches
        run: |
          php artisan config:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan storage:link || true

      # Create custom PHP ini file to load mongodb.so on Azure
      - name: Create custom ini to load mongodb.so
        run: |
          mkdir -p .ini
          echo "extension=/home/site/wwwroot/bin/mongodb.so" > .ini/extensions.ini

      # Package everything for deployment
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5F3A8BC8343A472DB4E5659D84985760 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_20CFA2F66E3F4450ABD473BF3DC6E037 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BE259A0BC329460AB3EE5B89494BFA02 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'niveshonline-website'
          slot-name: 'Production'
          package: .
          