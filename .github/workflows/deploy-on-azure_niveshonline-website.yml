name: Build and deploy PHP app to Azure Web App - niveshonline-website

on:
  push:
    branches: [ deploy-on-azure ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Build mongodb.so matching PHP 8.2
      - name: Install PHP 8.2 toolchain (for building ext)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt-get update
          sudo apt-get install -y php8.2 php8.2-dev php-pear build-essential

      - name: Build mongodb extension via PECL
        run: |
          printf "\n" | sudo pecl install mongodb
          EXT_DIR=$(php -i | awk -F'=> ' '/extension_dir/ {print $2}')
          mkdir -p bin
          cp "$EXT_DIR/mongodb.so" bin/mongodb.so
          ls -l bin

      # 2) App dependencies
      - name: Setup PHP for Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer deps (ignore ext-mongodb on runner)
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --ignore-platform-req=ext-mongodb

      # 3) Laravel optimizations (safe ones)
      - name: Laravel optimize (no DB actions)
        run: |
          php artisan config:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan storage:link || true

      # 4) Provide custom ini that loads the extension at runtime
      - name: Create custom ini to load mongodb.so
        run: |
          mkdir -p .ini
          echo "extension=/home/site/wwwroot/bin/mongodb.so" > .ini/extensions.ini

      # 6) Package artifact
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Azure Login (federated)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2CD8CA237E7A4846BBA8D8FFE7F34F9F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4EC87C0C6FAB446DA00776CD4B1D8A1D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7F8A2E4B2D8146B19D3A3EAB520CCFC2 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'niveshonline-website'
          slot-name: 'Production'
          package: .